# Projects

- project: "L-T4/L-T3 pharmacokinetics: scoping review &amp; planned PBPK model"
  role: Independent project
  duration: Mar. 2026 &mdash; Present
  url:
  description: <ul><li>Registered a PRISMA-ScR scoping-review protocol mapping published human pharmacokinetic data for levothyroxine and liothyronine; no existing systematic or scoping review of this literature was identified.</li><li>Built a reproducible PubMed retrieval pipeline (NCBI E-utilities)&#58; ~48,000 records from MeSH, free-text and supplementary query families, de-duplicated, with backward citation chasing and recall checked against an external PK-literature database (PKPDAI).</li><li>Wrote a deterministic, MeSH-based rule classifier that routes records into five evidence tracks and records, for each decision, what a reviewer must read to confirm it (evidence tiers E0&ndash;E3); rules checked by sampling against a held-out audit set.</li><li>Next phases (not started)&#58; PK-data curation, then an SBML reimplementation of two published thyroid-hormone model lineages with an oral-dosing layer, targeting BioModels deposition.</li></ul> Technologies&#58; Python, pandas, NCBI E-utilities.

