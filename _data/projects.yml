# Projects

- project: Galaxy DEE2
  role: Developer
  duration: Feb. 2023 &mdash; Sep. 2023
  url: "https://github.com/IulianIV/dee2-galaxy"
  description: Python Galaxy wrapper and standalone package for the getDEE2 R library, enabling programmatic access to the DEE2 repository of uniformly processed RNA-seq data across 9+ species. Bridges R and Python via rpy2, converting SummarizedExperiment objects to pandas DataFrames. Supports CLI usage, Galaxy platform integration, and TSV export for downstream statistical analysis. Technologies&#58; Python, R, rpy2, pandas, Galaxy Platform, XML, Nginx.

- project: PK-PD Concentration Modeling Tools
  role: Developer
  duration: 2024 &mdash; Present
  url:
  description: Pharmacokinetic modeling tools implementing one- and two-compartment models for estimating blood and tissue concentrations of bioactive compounds over time. Features ODE-based simulation of absorption, distribution, and elimination kinetics using SciPy, with support for multi-compound interaction modeling, dosing schedule optimization, and calibration against laboratory results. Technologies&#58; Python, SciPy, NumPy, Flask, React.

